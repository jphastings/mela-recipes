<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Lemonade</title></head>
<body>
  <article class="h-recipe">
    <h1 class="p-name">Lemonade</h1>
    <p class="p-summary">A refreshing summer drink.</p>
    <p>Makes <span class="p-yield">1 jug</span></p>
    <p>Ready in <time class="dt-duration" datetime="PT5M">5 minutes</time></p>
    <ul>
      <li class="p-ingredient">4 lemons</li>
      <li class="p-ingredient">1 cup sugar</li>
      <li class="p-ingredient">1 litre water</li>
    </ul>
    <div class="e-instructions">
      <ol>
        <li>Juice the lemons into a jug.</li>
        <li>Stir in the sugar and water until dissolved.</li>
        <li>Chill well before serving over ice.</li>
      </ol>
    </div>
    <span class="p-category">Drinks</span>
    <span class="p-author">Jo</span>
  </article>
</body>
</html>
