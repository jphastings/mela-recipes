<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Guacamole</title></head>
<body>
  <article itemscope itemtype="https://schema.org/Recipe">
    <h1 itemprop="name">Guacamole</h1>
    <p itemprop="description">Fresh and zesty.</p>
    <p>Serves <span itemprop="recipeYield">2 cups</span></p>
    <p>Prep: <time itemprop="prepTime" datetime="PT10M">10 minutes</time></p>
    <ul>
      <li itemprop="recipeIngredient">3 ripe avocados</li>
      <li itemprop="recipeIngredient">1 lime, juiced</li>
      <li itemprop="recipeIngredient">salt to taste</li>
    </ul>
    <ol>
      <li itemprop="recipeInstructions">Mash the avocados in a bowl.</li>
      <li itemprop="recipeInstructions">Stir through the lime juice and salt.</li>
    </ol>
    <span itemprop="recipeCategory">Dip</span>
    <span itemprop="author" itemscope itemtype="https://schema.org/Person">
      <span itemprop="name">Alex</span>
    </span>
  </article>
</body>
</html>
